# Don't allow dependencies to be used before they have been released for at least 1 week
minimumReleaseAge: 10080
#minimumReleaseAgeExclude: 

# Don't warn about ignored build scripts
ignoredBuiltDependencies: []

# Hoist all dependencies to the root of node_modules, for better compatibility with packages that expect flat node_modules
shamefullyHoist: true

allowBuilds:
  '@parcel/watcher': true
  unrs-resolver: true

overrides:
  'brace-expansion@1.1.11': '>=1.1.21'
  'brace-expansion@2.1.4': '>=2.1.7 <3'
  'brace-expansion@5.0.9': '>=5.0.12'
  'flatted@3.2.7': '>=3.4.2'
  'lodash@4.17.21': '>=4.17.23'
  'source-map-js@1.2.1': '>=1.2.2'
  'picomatch@2.3.1': '>=2.3.2'
  'yaml@2.4.5': '>=2.8.3'
  'micromatch@4.0.7': '>=4.0.8'
  'ajv@5.12.6': '>=6.14.0'
  'decode-uri-component@0.2.2': '>=0.5.1'
  'minimatch@>=9 <11': '>=11.0.1'
  '@types/react': '^18.3.1'
  '@types/react-dom': '^18.3.0'
  # hds-react pins cookie 0.4.2; react-router 7 needs cookie ^1, so only patch old versions
  'cookie@<0.7.0': '^0.7.2'
  'postcss@<8.5.23': '^8.5.23'
  'immutable@<5.1.8': '^5.1.8'
  'js-yaml@>=4 <4.3.2': '^4.3.2'
  'nanoid@>=3 <3.3.18': '3.3.18'

patchedDependencies:
  eslint-plugin-import-x@4.17.1: patches/eslint-plugin-import-x@4.17.1.patch
